<div #scrollContainer id="log" cdkVirtualScrollingElement>
  <cdk-virtual-scroll-viewport itemSize="20">
    <app-log-message
      *cdkVirtualFor="let entry of log.visibleMessages; let index = index; trackBy: getId"
      [log]="entry"
      [isNewDay]="isNewDay(index)">
    </app-log-message>
  </cdk-virtual-scroll-viewport>
</div>


@if (manualScroll) {
  <p-button icon="pi pi-arrow-down" [rounded]="true" (click)="scrollAutomatically()" class="btn-autoscroll"></p-button>
}
