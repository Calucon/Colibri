<div class="header no-select">
  <div class="logo">
    <img src="assets/logo_small.webp">
    <h1>Colibri</h1>
  </div>

  <div class="tabs">
    @for (tab of tabs; track tab) {
      <a [routerLink]="tab.path" routerLinkActive="active">{{ tab.label }}</a>
    }

    <div class="active-indicator" [style]="{ 'left': indicatorPosition() }"></div>
  </div>

  <div class="selector">
    <app-broadcast-toggle/>
    <app-filter-bar/>
  </div>
</div>

<div class="content">
  <router-outlet></router-outlet>
</div>
