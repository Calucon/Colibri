<div class="log-filters">
  <p-selectbutton
    [options]="levelOptions"
    optionLabel="label"
    optionValue="value"
    [multiple]="true"
    [ngModel]="selectedLevels()"
    (onChange)="onLevelsChanged($event)">
  </p-selectbutton>

  <label class="sync-toggle" title="Show broadcast:: sync traffic between an app's own clients (e.g. state/position ticks). Hidden by default since it's high-volume; shown regardless of the level filter above.">
    <span>Sync traffic</span>
    <p-toggleswitch [(ngModel)]="showBroadcastTraffic"></p-toggleswitch>
  </label>
</div>
