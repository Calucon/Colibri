<div class="log-filters">
  <p-selectbutton
    [options]="levelOptions"
    optionLabel="label"
    optionValue="value"
    [multiple]="true"
    [ngModel]="selectedLevels"
    (onChange)="onLevelsChanged($event)">
  </p-selectbutton>

  <label class="sync-toggle">
    <span>Sync traffic</span>
    <p-toggleswitch [(ngModel)]="showBroadcastTraffic"></p-toggleswitch>
  </label>
</div>
